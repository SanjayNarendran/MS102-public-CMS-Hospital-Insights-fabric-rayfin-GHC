id: cms-quality-dashboard
name: cms-quality-dashboard
version: 1.0.0
services:
  auth:
    enabled: true
    fabric:
      enabled: true
    password:
      enabled: false
    allowedRedirectUris:
      - http://localhost:5173
      - http://127.0.0.1:5173
      # The first `rayfin up` adds the app's hosting URL (https://<name>.webapp.fabricapps.net) here; keep it out of
      # commits to a shared repository
  # Ask your data's saved chats (rayfin/data/) and functions (rayfin/functions/): off for the dashboard alone;
  # copilot/deploy.py app switches both on
  data:
    enabled: false
    dialect: mssql
  staticHosting:
    enabled: true
    folder: dist
    buildCommand: npm run build
    indexDocument: index.html
    assetAccess: protected
  storage:
    enabled: false
  functions:
    enabled: false
    buildCommand: npm run build
    auth:
      type: application
secrets:
  - name: CHAT_TICKET_KEY
    description: Signs the chat tickets that Ask your data sends to the GitHub Copilot relay
